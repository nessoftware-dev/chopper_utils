openapi: 3.0.3
info:
  title: Chopper Utils Example API
  version: 1.0.0

servers:
  - url: https://example.test

paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful

  /auth/refresh:
    post:
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /public-message:
    get:
      operationId: getPublicMessage
      responses:
        '200':
          description: Public response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /private-message:
    get:
      operationId: getPrivateMessage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Private response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Access token expired

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
